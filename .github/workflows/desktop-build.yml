name: Desktop build

on:
  push:
    branches:
      - feature/tauri2-react-control-center
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  rust-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust backend
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
