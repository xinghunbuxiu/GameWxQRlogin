[package]
name = "gamepilot"
version = "0.1.0"
description = "GamePilot Android device control center"
authors = ["GamePilot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

tauri-plugin-dialog = "2"
